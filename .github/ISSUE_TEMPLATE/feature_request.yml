name: Feature request
description: Something you'd like Anynotate to do.
labels: ["enhancement"]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you want to do
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What it would help with, and what you do today instead.
  - type: textarea
    id: ideas
    attributes:
      label: Ideas
      description: How it could work, if you have thoughts.
