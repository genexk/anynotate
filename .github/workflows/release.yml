name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test --timeout 30000

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(bun -p 'require("./package.json").version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - run: bun run build:binaries
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries
          path: dist/bin/
          if-no-files-found: error

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries
          path: dist/bin
      - name: Give the installer agents to hook
        run: mkdir -p "$HOME/.claude" "$HOME/.codex"
      - name: Install with install.sh
        if: runner.os != 'Windows'
        run: ANYNOTATE_BASE_URL="file://$PWD/dist/bin" sh scripts/install.sh
      - name: Parse install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host "line $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          "PowerShell $($PSVersionTable.PSVersion) parses install.ps1"
      - name: Parse install.ps1 (PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host "line $($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          "PowerShell $($PSVersionTable.PSVersion) parses install.ps1"
      - name: Install with install.ps1 (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:ANYNOTATE_BASE_URL = ([Uri](Resolve-Path dist/bin).Path).AbsoluteUri
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: bun scripts/smoke.ts
      - name: Bridge log
        if: failure()
        run: cat "$HOME/.anynotate/bridge.log" || true

  release:
    needs: [test, smoke]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries
          path: dist/bin
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/bin/* scripts/install.sh scripts/install.ps1 --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
